<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- The app icon: a shaded colour wheel with a puck, on a graphite tile.
       `cargo xtask icons packaging/icons` draws every size from this file. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C2D30"/>
      <stop offset="1" stop-color="#111213"/>
    </linearGradient>
    <radialGradient id="ringShade" cx="256" cy="256" r="206" gradientUnits="userSpaceOnUse">
      <stop offset="0.7" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="0.8" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.93" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <linearGradient id="ringLight" x1="0" y1="52" x2="0" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="centre" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#303134"/>
      <stop offset="1" stop-color="#151617"/>
    </radialGradient>
    <linearGradient id="puck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFCF5"/>
      <stop offset="1" stop-color="#D3CAB7"/>
    </linearGradient>
    <filter id="wheelShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="puckShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>
  <circle cx="256" cy="270" r="206" fill="#000000" opacity="0.5" filter="url(#wheelShadow)"/>
  <path d="M254.2 52.0 A204 204 0 0 1 359.5 80.2 L330.1 130.2 A146 146 0 0 0 254.7 110.0 Z" fill="#EA3232"/>
  <path d="M356.5 78.4 A204 204 0 0 1 433.6 155.5 L383.1 184.1 A146 146 0 0 0 327.9 128.9 Z" fill="#EA8E32"/>
