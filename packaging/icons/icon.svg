  <path d="M433.6 356.5 A204 204 0 0 1 356.5 433.6 L327.9 383.1 A146 146 0 0 0 383.1 327.9 Z" fill="#32EA32"/>
  <path d="M359.5 431.8 A204 204 0 0 1 254.2 460.0 L254.7 402.0 A146 146 0 0 0 330.1 381.8 Z" fill="#32EA8E"/>
  <path d="M257.8 460.0 A204 204 0 0 1 152.5 431.8 L181.9 381.8 A146 146 0 0 0 257.3 402.0 Z" fill="#32EAEA"/>
  <path d="M155.5 433.6 A204 204 0 0 1 78.4 356.5 L128.9 327.9 A146 146 0 0 0 184.1 383.1 Z" fill="#328EEA"/>
  <path d="M80.2 359.5 A204 204 0 0 1 52.0 254.2 L110.0 254.7 A146 146 0 0 0 130.2 330.1 Z" fill="#3232EA"/>
  <path d="M52.0 257.8 A204 204 0 0 1 80.2 152.5 L130.2 181.9 A146 146 0 0 0 110.0 257.3 Z" fill="#8E32EA"/>
  <path d="M78.4 155.5 A204 204 0 0 1 155.5 78.4 L184.1 128.9 A146 146 0 0 0 128.9 184.1 Z" fill="#EA32EA"/>
  <path d="M152.5 80.2 A204 204 0 0 1 257.8 52.0 L257.3 110.0 A146 146 0 0 0 181.9 130.2 Z" fill="#EA328E"/>
  <circle cx="256" cy="256" r="175" fill="none" stroke="url(#ringShade)" stroke-width="58"/>
  <circle cx="256" cy="256" r="175" fill="none" stroke="url(#ringLight)" stroke-width="58"/>
  <circle cx="256" cy="256" r="138" fill="url(#centre)"/>
  <circle cx="256" cy="256" r="136" fill="none" stroke="#000000" stroke-opacity="0.45" stroke-width="5"/>
  <g stroke="#3A3B3E" stroke-width="3">
    <path d="M156 256 H356"/>
    <path d="M256 156 V356"/>
  </g>
  <path d="M256 256 L310 202" stroke="#EDE6D6" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
