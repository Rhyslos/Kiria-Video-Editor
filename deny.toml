# Dependency checks run in CI with cargo-deny.
# Keeps licences compatible with an open-source release and blocks known-vulnerable crates.

[licenses]
# Licences compatible with GPL-3.0-or-later. FFmpeg is handled separately (Phase 1).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "GPL-3.0-or-later",
    "BSL-1.0",
]
# The interface library's built-in fallback fonts (symbols, emoji) carry font licences.
exceptions = [
    { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]
# Our own crates are not published to crates.io.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# Report unmaintained crates only when we depend on them directly; deep
# dependencies of the interface libraries are their maintainers' call.
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
