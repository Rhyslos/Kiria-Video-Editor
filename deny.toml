# Dependency checks run in CI with cargo-deny.
# Keeps licences compatible with an open-source release and blocks known-vulnerable crates.

[licenses]
# Licences compatible with GPL-3.0-or-later. FFmpeg is handled separately (Phase 1).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "GPL-3.0-or-later",
    "BSL-1.0",
]
# The interface library's built-in fallback fonts (symbols, emoji) carry font licences.
exceptions = [
    { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
    # The list of trusted certificate authorities used for HTTPS update checks is data under a permissive data licence.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    # The FFmpeg bindings: a permissive licence the Free Software Foundation lists as GPL-compatible.
    { allow = ["WTFPL"], crate = "ffmpeg-sys-next" },
]
# Our own crates are not published to crates.io.
private = { ignore = true }

[bans]
# Two versions of one crate are refused, so a new one shows up in review.
# The ones below come in through other crates and can't be removed here;
# each names the older version. Take an entry out when an update ends it.
multiple-versions = "deny"
skip = [
    # The window library brings older versions of what the interface library uses.
    { crate = "bitflags@1.3.2", reason = "winit 0.30 (macOS graphics types, Redox)" },
    { crate = "block2@0.5.1", reason = "winit 0.30 and accesskit (macOS, iOS)" },
    { crate = "objc2@0.5.3", reason = "winit 0.30 and accesskit (macOS, iOS)" },
    { crate = "objc2-app-kit@0.2.2", reason = "winit 0.30 and accesskit (macOS)" },
    { crate = "objc2-foundation@0.2.2", reason = "winit 0.30 and accesskit (macOS, iOS)" },
    { crate = "objc2-ui-kit@0.2.2", reason = "winit 0.30 and accesskit (iOS)" },
    { crate = "calloop@0.13.0", reason = "winit 0.30's Wayland toolkit; the clipboard brings 0.14" },
    { crate = "calloop-wayland-source@0.3.0", reason = "winit 0.30's Wayland toolkit; the clipboard brings 0.4" },
    { crate = "smithay-client-toolkit@0.19.2", reason = "winit 0.30; the interface library's clipboard brings 0.20" },
    { crate = "rustix@0.38.44", reason = "winit 0.30's Wayland toolkit; everything else uses 1.x" },
    { crate = "linux-raw-sys@0.4.15", reason = "rustix 0.38 (winit 0.30's Wayland toolkit)" },
    { crate = "thiserror@1.0.69", reason = "winit 0.30's Wayland toolkit and Android support; the rest use 2" },
    { crate = "thiserror-impl@1.0.69", reason = "thiserror 1 (winit 0.30)" },
    { crate = "tiny-skia@0.11.4", reason = "winit 0.30's window frame on Wayland; xtask's icon drawing brings 0.12" },
    { crate = "tiny-skia-path@0.11.4", reason = "tiny-skia 0.11 (winit 0.30)" },
    { crate = "redox_syscall@0.4.1", reason = "winit 0.30 (Redox)" },
    { crate = "redox_syscall@0.5.18", reason = "parking_lot (Redox); libredox brings 0.9" },
    { crate = "windows-sys@0.52.0", reason = "ring (HTTPS for updates) and winit 0.30" },
    { crate = "windows-sys@0.59.0", reason = "rustix 0.38 (winit 0.30)" },
    { crate = "jni-sys@0.3.1", reason = "ndk (Android) for winit and the sound library; jni brings 0.4" },
    { crate = "mach2@0.4.3", reason = "the sound thread's priority on macOS; the sound library brings 0.6" },
    # Hash maps and random numbers: each library picks its own.
    { crate = "hashbrown@0.15.5", reason = "petgraph (the clipboard's file types)" },
    { crate = "hashbrown@0.16.1", reason = "gpu-allocator (wgpu)" },
    { crate = "foldhash@0.1.5", reason = "hashbrown 0.15" },
    { crate = "rustc-hash@1.1.0", reason = "wgpu and naga; bindgen brings 2" },
    { crate = "getrandom@0.2.17", reason = "ring (HTTPS for updates)" },
    { crate = "getrandom@0.3.4", reason = "ahash (the interface library) and xtask" },
    { crate = "r-efi@5.3.0", reason = "getrandom 0.3" },
    { crate = "rand_core@0.9.5", reason = "imbl (the project's undo history)" },
    # Build-time and other one-offs.
    { crate = "itertools@0.13.0", reason = "bindgen (the FFmpeg bindings, at build time)" },
    { crate = "nom@7.1.3", reason = "bindgen (the FFmpeg bindings, at build time)" },
    { crate = "shlex@1.3.0", reason = "bindgen (the FFmpeg bindings, at build time)" },
    { crate = "syn@2.0.119", reason = "bindgen and many derive macros; others have moved to 3" },
    { crate = "miniz_oxide@0.8.9", reason = "png (pictures); flate2 brings 0.9" },
]
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# Report unmaintained crates only when we depend on them directly; deep
# dependencies of the interface libraries are their maintainers' call.
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
