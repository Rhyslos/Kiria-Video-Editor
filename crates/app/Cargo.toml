[package]
name = "app"
description = "The editor window and its five pages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "editor"
path = "src/main.rs"

[dependencies]
brand = { path = "../brand" }
diag = { path = "../diag" }
eframe = "0.37"
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
jobs = { path = "../jobs" }
project = { path = "../project" }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
ui-kit = { path = "../ui-kit" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
