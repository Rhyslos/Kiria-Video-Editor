[package]
name = "launcher"
description = "The small program that opens first: the project browser and updates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "launcher"
path = "src/main.rs"

[dependencies]
brand = { path = "../brand" }
diag = { path = "../diag" }
directories = "6"
eframe = "0.37"
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
project = { path = "../project" }
project-index = { path = "../project-index" }
rfd = "0.18"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
ui-kit = { path = "../ui-kit" }
updater = { path = "../updater" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
