[package]
name = "media"
description = "Reading and writing media files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
diag = { path = "../diag" }
project = { path = "../project" }
libloading = "0.8"
sha2 = "0.10"
tracing = "0.1"
# The window's graphics device, for decoding on it.
video-device = { path = "../video-device" }
# FFmpeg, linked dynamically. `cargo xtask ffmpeg` fetches the pinned build the
# build reads (FFMPEG_DIR in .cargo/config.toml).
ffmpeg-sys-next = { version = "8.1", default-features = false, features = ["avcodec", "avformat", "swscale", "swresample"] }

[dev-dependencies]
tempfile = "3"
# A device without a window, and reading images back.
video-device = { path = "../video-device", features = ["testing"] }

[lints]
workspace = true
