[package]
name = "engine"
description = "Ties the parts together."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# The sound card. `realtime`: its callback runs at the priority the system
# gives sound (the multimedia scheduler on Windows, real-time scheduling on
# Linux), through a helper crate under MPL-2.0; a refusal is logged.
cpal = { version = "0.18", features = ["realtime"] }
# The real-time mixer: track effects, the master, meters (pure Rust).
audio = { path = "../audio" }
# Proxies: the preview shows their frames first.
cache = { path = "../cache" }
diag = { path = "../diag" }
# Sync by sound compares sounds by their frequencies (MIT or Apache-2.0,
# pure Rust; the audio engine uses the same).
realfft = "3.5"
image = { version = "0.25", default-features = false, features = ["png"] }
media = { path = "../media" }
# Very small numbers as zero on the sound card's thread; the counting
# allocator in tests.
os = { path = "../os" }
project = { path = "../project" }
render = { path = "../render" }
# The graphics library the windows are drawn with: pictures are put together
# on the window's device.
wgpu = "30"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
# Waits for a graphics device without a window, to put pictures together on.
pollster = "1"
# A graphics device without a window, to try decoding on one.
video-device = { path = "../video-device", features = ["testing"] }

[lints]
workspace = true
