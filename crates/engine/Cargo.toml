[package]
name = "engine"
description = "Ties the parts together."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
cpal = "0.18"
rtrb = "0.4"
# Proxies: the preview shows their frames first.
cache = { path = "../cache" }
diag = { path = "../diag" }
image = { version = "0.25", default-features = false, features = ["png"] }
media = { path = "../media" }
project = { path = "../project" }
render = { path = "../render" }
# The graphics library the windows are drawn with: pictures are put together
# on the window's device.
wgpu = "30"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
# Waits for a graphics device without a window, to put pictures together on.
pollster = "1"
# A graphics device without a window, to try decoding on one.
video-device = { path = "../video-device", features = ["testing"] }

[lints]
workspace = true
