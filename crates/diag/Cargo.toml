[package]
name = "diag"
description = "Explained errors, logging and crash reports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
brand = { path = "../brand" }
# Already in the build through tracing-appender; the log writer's queue.
crossbeam-channel = "0.5"
directories = "6"
# Already in the build through tracing-appender; only its formatting is added.
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
