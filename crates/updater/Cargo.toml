[package]
name = "updater"
description = "Release checks and safe installs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "0.22"
brand = { path = "../brand" }
diag = { path = "../diag" }
ed25519-dalek = "2"
ron = "0.12"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
ureq = "3"
# Unpacking update packages (only the decompressor the packages use).
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
