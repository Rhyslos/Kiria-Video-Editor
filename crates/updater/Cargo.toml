[package]
name = "updater"
description = "Release checks and safe installs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "0.22"
brand = { path = "../brand" }
diag = { path = "../diag" }
ed25519-dalek = "2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
