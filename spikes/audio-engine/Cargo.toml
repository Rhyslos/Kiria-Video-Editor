# Spike: not part of the workspace (see spikes/README.md).
[package]
name = "audio-bench"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[workspace]

[dependencies]
# Both MIT or Apache-2.0, pure Rust.
realfft = "3.5"
rtrb = "0.4"

[profile.release]
debug = false

# Only to read a thread's own processor time and raise its priority.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }
