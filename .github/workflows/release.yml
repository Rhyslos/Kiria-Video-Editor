name: Release

# A tag like v0.1.0 (stable) or v0.2.0-beta.1 (beta), or "Run workflow" with
# a tag typed in, builds the installers, tests them, signs the manifest and
# publishes the GitHub release. Installed copies pick it up on their next start.
# Nothing is published if any build, test or signature check fails, or if an
# installed copy of the previous release can't update to this one (the
# update drill).
# Every push to main publishes an automatic beta (e.g. 0.1.1-beta.12) that beta
# builds pick up by themselves. Pull requests run the same build without
# publishing, so every feature can be tried from a real installer (download
# "windows" from the run's artifacts).
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.1.0 (leave empty for a test run without a release)"
        required: false
        default: ""
      crash_test:
        description: "Publish a deliberately broken beta whose editor crashes on start (tests rollback; leave the tag empty)"
        type: boolean
        required: false
        default: false

# One release of a branch at a time. Two pushes to main close together used
# to publish two betas side by side, and the check that installed copies find
# "this release" then failed for the older one, because they rightly went to
# the newer. A run that is under way finishes; of those waiting behind it
# only the newest is kept.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Read by packaging/release-env.sh, which sets APP_VERSION, RELEASE_TAG and,
  # for automatic betas, BUILD_VERSION (the version compiled into the programs).
  REF_TYPE: ${{ github.ref_type }}
  REF_NAME: ${{ github.ref_name }}
  INPUT_TAG: ${{ inputs.tag }}
  EVENT: ${{ github.event_name }}
  RUN_NUMBER: ${{ github.run_number }}
  CRASH_TEST: ${{ inputs.crash_test }}

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Name, version and release tag
        shell: bash
        run: packaging/release-env.sh >> "$GITHUB_ENV"
      - name: Version matches the tag
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          $tag = "$env:RELEASE_TAG".TrimStart('v')
          if ($tag -ne $env:APP_VERSION) { throw "The tag says $tag but Cargo.toml says $env:APP_VERSION. Bump the version first (RELEASING.md)." }
      - name: libclang for the FFmpeg bindings (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
      - name: FFmpeg for building
        run: cargo xtask ffmpeg
      - name: Build
        run: cargo build --release -p app -p launcher
      - name: Stage files and FFmpeg
        shell: pwsh
        run: packaging/windows/stage.ps1 -Stage target/stage-windows -Out target/dist
      - name: Build the installer
        shell: pwsh
        run: |
          $env:STAGE_DIR = (Resolve-Path target/stage-windows).Path
          $env:OUT_DIR = (Resolve-Path target/dist).Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss
      - name: Install silently, start the editor, uninstall
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "install-test"
          $setup = "target/dist/$env:APP_NAME-Setup-$env:APP_VERSION.exe"
          Start-Process -Wait $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$dir"
          if (-not (Test-Path "$dir/launcher.exe")) { throw "The launcher was not installed." }
          if (-not (Test-Path "$dir/versions/$env:APP_VERSION/launcher.exe")) { throw "The version folder has no launcher for updates." }
          if ((Get-Content "$dir/current") -ne $env:APP_VERSION) { throw "The current-version file is wrong." }
          if (-not (Test-Path "$dir/versions/$env:APP_VERSION/user-guide/index.html")) { throw "The user guide was not installed." }
          $editor = "$dir/versions/$env:APP_VERSION/editor.exe"
          if ($env:BUILD_CRASH_TEST -ne "1") {
            $run = Start-Process -Wait -PassThru $editor -ArgumentList "--smoke-test"
            if ($run.ExitCode -ne 0) { throw "The installed editor failed its smoke test (exit $($run.ExitCode))." }
          }
          Start-Process -Wait "$dir/unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES"
          Start-Sleep -Seconds 3
          if (Test-Path "$dir/versions") { throw "Uninstalling left the versions folder behind." }
          Write-Host "Installed, started and uninstalled cleanly."
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/dist/*.exe
            target/dist/*.zip

  # Paused (November 2026): releases are Windows only for now. To turn the
  # AppImage back on, delete the `if: false` line and put `linux` back into the
  # publish job's `needs`.
  linux:
    name: Linux AppImage
    if: false
    runs-on: ubuntu-22.04 # the oldest supported base keeps the AppImage working on older distributions
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Tools for building and testing
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libgl1-mesa-dri libxkbcommon-x11-0 file libasound2-dev
      - name: Name, version and release tag
        run: packaging/release-env.sh >> "$GITHUB_ENV"
      - name: FFmpeg for building
        run: cargo xtask ffmpeg
      - name: Build
        run: cargo build --release -p app -p launcher
      - name: Build the AppImage
        run: packaging/linux/build-appimage.sh
      - name: Start the editor from the AppImage
        if: env.BUILD_CRASH_TEST != '1'
        run: |
          cd target/dist
          ./"$APP_NAME-$APP_VERSION-linux-x86_64.AppImage" --appimage-extract >/dev/null
          LD_LIBRARY_PATH=squashfs-root/usr/lib xvfb-run -a -s "-screen 0 1600x1000x24" squashfs-root/usr/bin/editor --smoke-test
          rm -rf squashfs-root
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/dist/*.AppImage

  sign:
    name: Sign the release
    needs: [windows] # and linux, when the AppImage is turned back on
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.facts.outputs.name }}
      version: ${{ steps.facts.outputs.version }}
      tag: ${{ steps.facts.outputs.tag }}
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Name, version and release tag
        run: packaging/release-env.sh >> "$GITHUB_ENV"
      - name: Pass them on to the next jobs
        id: facts
        run: |
          echo "name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Manifest and signature
        id: sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          shopt -s nullglob # no AppImage while the Linux build is paused
          cargo xtask manifest dist/manifest.json "$APP_VERSION" dist/*.zip dist/*.AppImage dist/*.exe
          if [ -z "$RELEASE_SIGNING_KEY" ] && [ -z "$RELEASE_TAG" ]; then
            echo "::warning::RELEASE_SIGNING_KEY is not set; a test run skips signing and the update drill. A tagged release fails without it."
            exit 0
          fi
          cargo xtask sign dist/manifest.json
          cargo xtask verify dist/manifest.json
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: signature
          path: |
            dist/manifest.json
            dist/manifest.json.sig

  # Nothing is published unless an installed copy of the previous release
  # finds this build, downloads it, checks it, installs it, starts it and
  # then says it is up to date (packaging/windows/update-drill.ps1). The
  # deliberately broken rollback-test build is the one exception.
  update-drill:
    name: Update from the previous release
    needs: [windows, sign]
    if: needs.sign.outputs.signed == 'true' && inputs.crash_test != true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: The previous release updates to this build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          packaging/windows/update-drill.ps1
          -Repo "${{ github.repository }}"
          -Name "${{ needs.sign.outputs.name }}"
          -Version "${{ needs.sign.outputs.version }}"
          -Dist dist

  publish:
    name: Publish the release
    needs: [windows, sign, update-drill]
    # The drill is skipped for unsigned test runs and the rollback-test build; a failed drill stops here.
    if: ${{ !cancelled() && needs.sign.result == 'success' && (needs.update-drill.result == 'success' || needs.update-drill.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_NAME: ${{ needs.sign.outputs.name }}
      APP_VERSION: ${{ needs.sign.outputs.version }}
      RELEASE_TAG: ${{ needs.sign.outputs.tag }}
      BUILD_CRASH_TEST: ${{ inputs.crash_test && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$APP_VERSION" in *-*) prerelease="--prerelease" ;; esac
          notes=(--notes-file CHANGELOG.md)
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = branch ]; then
            notes=(--notes "Automatic test build of ${{ github.sha }}: $(git log -1 --format=%s ${{ github.sha }})")
          fi
          if [ "${BUILD_CRASH_TEST:-}" = 1 ]; then
            notes=(--notes "Deliberately broken test build: its editor crashes on start, so installed copies should switch back to the previous version by themselves and never offer this one again.")
          fi
          # For a hand-started run or a beta the tag is created on this commit.
          gh release create "$RELEASE_TAG" $prerelease --target "${{ github.sha }}" \
            --title "$APP_NAME $APP_VERSION" "${notes[@]}" dist/*
      # Only the newest automatic betas stay on the releases page (see the
      # script for why). A pull request's run only says what would go.
      - name: Remove old automatic betas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          packaging/prune-betas.sh --self-test
          if [ -n "$RELEASE_TAG" ]; then
            packaging/prune-betas.sh "${{ github.repository }}" || echo "::warning::Old betas could not be removed."
          else
            packaging/prune-betas.sh "${{ github.repository }}" --dry-run || echo "::warning::Old betas could not be listed."
          fi

  # Once it is out: an installed copy of the previous release asks GitHub
  # itself, as everybody's copy does, and must end up on this release.
  after-publish:
    name: Installed copies find this release
    needs: [sign, publish]
    if: needs.sign.outputs.tag != '' && inputs.crash_test != true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: The previous release updates to this one from GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          packaging/windows/update-drill.ps1
          -Repo "${{ github.repository }}"
          -Name "${{ needs.sign.outputs.name }}"
          -Version "${{ needs.sign.outputs.version }}"
          -Published
