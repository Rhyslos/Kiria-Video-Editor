# Builds the highlight finder measurement program (spikes/highlights) for
# Windows as a ready-to-run zip. Started by hand, or when the spike changes.
name: Highlights spike

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["spikes/highlights/**", ".github/workflows/spike-highlights.yml"]

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal
      - name: FFmpeg (the pinned build)
        run: |
          source packaging/ffmpeg.env
          curl -sSL -o ffmpeg.zip "$FFMPEG_WINDOWS_URL"
          7z x -y ffmpeg.zip > /dev/null
          echo "FFMPEG_DIR=$(cygpath -w "$PWD/$(ls -d ffmpeg-*-win64-gpl-shared-*/ | head -1)")" >> "$GITHUB_ENV"
      - name: Build
        working-directory: spikes/highlights
        env:
          RUSTUP_TOOLCHAIN: stable
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: cargo build --release
      - name: Tests and a short run
        working-directory: spikes/highlights
        env:
          RUSTUP_TOOLCHAIN: stable
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          export PATH="$(cygpath -u "$FFMPEG_DIR")/bin:$PATH"
          cargo test --release
          target/release/highlight-bench.exe make-clips smoke --seconds 30 --small
          target/release/highlight-bench.exe --decode software --frames all,nodeblock,keys --found smoke-found smoke/*.mkv
          # The build machine has no GPU video decoder, so this only shows that asking for one is safe.
          target/release/highlight-bench.exe --decode d3d11va --frames all --found smoke-found smoke/calm.mkv || echo "the d3d11va run failed here; it needs a real GPU"
      - name: Package
        run: |
          mkdir -p pkg/bin pkg/recordings
          cp spikes/highlights/run.ps1 spikes/highlights/run.bat spikes/highlights/README.md pkg/
          cp spikes/highlights/target/release/highlight-bench.exe pkg/bin/
          cp "$(cygpath -u "$FFMPEG_DIR")"/bin/ffmpeg.exe "$(cygpath -u "$FFMPEG_DIR")"/bin/*.dll pkg/bin/
          cp "$(cygpath -u "$FFMPEG_DIR")"/LICENSE* pkg/bin/ 2>/dev/null || true
          echo "Put your recordings here, each with a .csv of picked moments beside it (see README.md)." > pkg/recordings/PUT-RECORDINGS-HERE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: highlight-bench-windows
          path: pkg/
