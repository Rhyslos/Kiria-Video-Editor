name: CI

on:
  push:
    branches: [main]
  pull_request:

# The token only reads: nothing here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux is paused (November 2026): add ubuntu-latest back here and in
        # the window job below to turn it on again. The Linux steps are kept.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # rust-toolchain.toml pins the Rust version; rustup installs it on first use.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: libclang for the FFmpeg bindings (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
      - name: Sound library headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: FFmpeg for building
        run: cargo xtask ffmpeg
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  window:
    name: Window smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux is paused, see the check job. While it is, the responsiveness
        # test and the screenshots below do not run in CI: run them by hand.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: libclang for the FFmpeg bindings (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
      - name: Sound library headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: FFmpeg for building
        run: cargo xtask ffmpeg
      - name: Software graphics and a virtual screen (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libgl1-mesa-dri libxkbcommon-x11-0
      - name: Build the editor and launcher
        run: cargo build -p app -p launcher
      - name: Open the window, draw, close (Windows)
        if: runner.os == 'Windows'
        run: target/debug/editor.exe --smoke-test
      - name: Open the window, draw, close (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" target/debug/editor --smoke-test
      - name: Launcher with 200 sample projects (Windows)
        if: runner.os == 'Windows'
        run: target/debug/launcher.exe --demo 200 --smoke-test
      - name: Launcher with 200 sample projects (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" target/debug/launcher --demo 200 --smoke-test
      - name: Interface stays responsive during an 8-second job (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" target/debug/editor --responsiveness-test
      - name: Screenshot
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" target/debug/editor --screenshot editor.png
          xvfb-run -a -s "-screen 0 1600x1000x24" target/debug/launcher --demo 14 --screenshot launcher.png
          xvfb-run -a -s "-screen 0 1600x1000x24" target/debug/launcher --demo 14 --update-window downloading --screenshot update-window.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Linux'
        with:
          name: screenshots
          path: |
            editor.png
            launcher.png
            update-window.png

  # While Linux is paused this keeps the code building there: it lints the
  # whole workspace (Linux-only code included) but runs no tests or windows.
  # Turning the Linux matrix entries back on makes this job redundant.
  linux-lint:
    name: Lint (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # libclang for the FFmpeg bindings comes with the runner image.
      - name: Sound library headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: FFmpeg for building
        run: cargo xtask ffmpeg
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

  licences:
    name: Dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
